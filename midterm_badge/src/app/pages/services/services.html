<div class="services-container">
  <h2>Service Tickets</h2>

  <!-- Search Box -->
  <div class="search-box">
    <input type="text" [formControl]="search" placeholder="Search posts..." />
  </div>

  <!-- Loading State -->
  <ng-template #loading>
    <p class="loading">Loading posts...</p>
  </ng-template>

  <!-- Posts List -->
  <div *ngIf="filteredPosts$ | async as posts; else loading">
    <div *ngIf="posts.length > 0; else noResults">
      <div class="post-card" *ngFor="let post of posts">
        <h3>{{ post.title | uppercase }}</h3>
        <p>{{ post.body | truncate:80 }}</p>
      </div>
    </div>

    <ng-template #noResults>
      <p class="no-results">No posts match your search.</p>
    </ng-template>
  </div>
</div>
