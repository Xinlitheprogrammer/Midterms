<div class="contact-container">
  <h2>Contact Us</h2>

  <!-- Contact Form -->
  <form>
    <div class="form-group">
      <label for="name">Name:</label>
      <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Your name" />
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="Your email" />
    </div>

    <div class="form-group">
      <label for="message">Message:</label>
      <textarea id="message" [(ngModel)]="message" name="message" placeholder="Your message"></textarea>
    </div>

    <button type="button" (click)="submit()">Submit</button>
  </form>

  <!-- Form Preview -->
  <div class="preview" *ngIf="name || email || message">
    <h3>Form Preview</h3>
    <p><strong>Name:</strong> {{ name | uppercase }}</p>
    <p><strong>Email:</strong> {{ email }}</p>
    <p><strong>Message:</strong> {{ message }}</p>
  </div>
</div>
